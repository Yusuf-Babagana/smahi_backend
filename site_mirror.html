<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Suspended</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Syne', sans-serif;
            background: #0d0f14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            text-align: center;
            max-width: 520px;
            width: 100%;
            animation: up 0.9s cubic-bezier(0.16,1,0.3,1) both;
        }

        .logo {
            margin-bottom: 52px;
            opacity: 0.9;
        }

        .logo img {
            height: 28px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #f5a623;
            border: 1px solid rgba(245,166,35,0.35);
            border-radius: 100px;
            padding: 5px 14px;
            margin-bottom: 28px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            font-size: clamp(1.9rem, 5.5vw, 2.6rem);
            line-height: 1.1;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
            white-space: nowrap;
            background: linear-gradient(
                90deg,
                #ffffff 0%,
                #ffffff 30%,
                #f5a623 45%,
                #ffe0a0 52%,
                #f5a623 58%,
                #ffffff 72%,
                #ffffff 100%
            );
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3.5s linear infinite;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 400;
            font-size: clamp(1rem, 2.8vw, 1.3rem);
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-bottom: 32px;
            opacity: 0.55;
            background: linear-gradient(
                90deg,
                #ffffff 0%,
                #ffffff 30%,
                #f5a623 45%,
                #ffe0a0 52%,
                #f5a623 58%,
                #ffffff 72%,
                #ffffff 100%
            );
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3.5s linear infinite;
        }

        @keyframes shimmer {
            0%   { background-position: 200% center; }
            100% { background-position: -50% center; }
        }

        .sub {
            font-size: 0.92rem;
            color: #6b7490;
            line-height: 1.65;
            margin-bottom: 44px;
            font-weight: 400;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: #0d0f14;
            text-decoration: none;
            border-radius: 6px;
            padding: 13px 24px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.01em;
            transition: opacity 0.2s, transform 0.2s;
            margin-bottom: 52px;
        }

        .cta:hover { opacity: 0.88; transform: translateY(-1px); }

        .cta img {
            height: 18px;
            width: auto;
            filter: brightness(0);
        }

        .powered {
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #8891a8;
            text-transform: uppercase;
        }

        .powered a {
            color: #8891a8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .powered a:hover { color: #fff; }

        @keyframes up {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1, h2 { white-space: normal; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="https://olitt.com/wp-content/uploads/2025/08/Olitt-logo-website-builder-300x118.webp" alt="Olitt">
        </div>

        <div class="badge">Account Suspended</div>

        <h1>Website suspended.</h1>
        <h2>Please check with your hosting admin.</h2>

        <p class="sub">Build and deploy your website in 2 minutes<br>using Olitt AI website builder.</p>

        <a href="https://olitt.com" target="_blank" class="cta">
            <img src="https://olitt.com/wp-content/uploads/2025/08/Olitt-logo-website-builder-300x118.webp" alt="">
            Get started free
        </a>

        <p class="powered">Powered by <a href="https://olitt.com" target="_blank">Olitt</a></p>
    </div>
</body>
</html>
